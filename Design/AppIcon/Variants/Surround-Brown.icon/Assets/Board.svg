<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Full-strength grid inside a 128px margin; fade only near canvas edges. -->
    <linearGradient id="edge-x" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0.18"/>
      <stop offset="0.035" stop-color="white" stop-opacity="0.40"/>
      <stop offset="0.075" stop-color="white" stop-opacity="0.70"/>
      <stop offset="0.125" stop-color="white" stop-opacity="1"/>
      <stop offset="0.875" stop-color="white" stop-opacity="1"/>
      <stop offset="0.925" stop-color="white" stop-opacity="0.70"/>
      <stop offset="0.965" stop-color="white" stop-opacity="0.40"/>
      <stop offset="1" stop-color="white" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="edge-y" href="#edge-x" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024"/>
    <mask id="fade-x" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#edge-x)"/>
    </mask>
    <mask id="fade-y" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#edge-y)"/>
    </mask>
  </defs>
  <g fill="#6B482B" mask="url(#fade-x)">
    <g mask="url(#fade-y)">
      <rect x="141" y="0" width="6" height="1024"/>
      <rect x="0" y="141" width="1024" height="6"/>
      <rect x="325" y="0" width="6" height="1024"/>
      <rect x="0" y="325" width="1024" height="6"/>
      <rect x="509" y="0" width="6" height="1024"/>
      <rect x="0" y="509" width="1024" height="6"/>
      <rect x="693" y="0" width="6" height="1024"/>
      <rect x="0" y="693" width="1024" height="6"/>
      <rect x="877" y="0" width="6" height="1024"/>
      <rect x="0" y="877" width="1024" height="6"/>
    </g>
  </g>
</svg>
