name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test coverage to run
        type: choice
        default: all
        options:
          - all
          - ipad18-focus

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select an iOS 26 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 26)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -scheme Surround \
            -project Surround.xcodeproj \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:SurroundTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/SurroundTests.xcresult

      - name: Export coverage report
        if: ${{ always() && hashFiles('TestResults/SurroundTests.xcresult/**') != '' }}
        shell: bash
        run: xcrun xccov view --report --json TestResults/SurroundTests.xcresult > TestResults/coverage.json

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  iphone-navigation-ui-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    name: iOS ${{ matrix.ios }} iPhone navigation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: '26'
            runner: macos-26
          - ios: '18'
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2 for iOS 18
        if: ${{ matrix.ios == '18' }}
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Select an iOS ${{ matrix.ios }} iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh '${{ matrix.ios }}' iPhone)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build iPhone navigation UI tests
        id: iphone_ui_build
        timeout-minutes: 15
        shell: bash
        run: |
          xcodebuild build-for-testing \
            -scheme Surround \
            -project Surround.xcodeproj \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/Surround-iPhoneUITests" \
            -parallel-testing-enabled NO \
            -only-testing:SurroundUITests

      - name: Run compact account and Messages navigation tests
        if: ${{ !cancelled() && steps.iphone_ui_build.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        run: |
          test_cases=(
            ProfileUITests/testCompactAccountMenuPushesOwnProfileAndOpensSettings
            SurroundUITests/testMessagesNavigationIsHiddenWhenSignedOut
            SurroundUITests/testMessagesNavigationRemainsAvailableWithoutThreads
          )
          selection_arguments=()
          for test_case in "${test_cases[@]}"; do
            test_class="${test_case%%/*}"
            test_name="${test_case#*/}"
            test_source="SurroundUITests/${test_class}.swift"
            class_count="$(grep -Ec "^[[:space:]]*final[[:space:]]+class[[:space:]]+${test_class}[[:space:]]*:[[:space:]]*SurroundJourneyUITestCase[[:space:]]*\{" "$test_source" || true)"
            declaration_count="$(grep -Ec "^[[:space:]]*func[[:space:]]+${test_name}[[:space:]]*\([[:space:]]*\)" "$test_source" || true)"
            if [[ "$class_count" != "1" || "$declaration_count" != "1" ]]; then
              echo "Expected exactly one ${test_class} class and ${test_name} declaration in ${test_source}. Update the iPhone navigation selection when renaming or moving it." >&2
              exit 1
            fi
            selection_arguments+=("-only-testing:SurroundUITests/${test_case}")
          done
          mkdir -p TestResults
          xcodebuild test-without-building \
            -scheme Surround \
            -project Surround.xcodeproj \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/Surround-iPhoneUITests" \
            -parallel-testing-enabled NO \
            "${selection_arguments[@]}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "TestResults/SurroundUITests-iPhone-iOS${{ matrix.ios }}-Navigation.xcresult"

      - name: Upload iPhone navigation UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-iphone-${{ matrix.ios }}-navigation-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  ipad-ui-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    runs-on: macos-26
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - name: Select an iPadOS 26 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 26 iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Prefer an iPadOS 26 hardware keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.simulator.outputs.id }}"

      - name: Build iPad UI tests
        id: ipad_ui_build
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh build \
            "${{ steps.simulator.outputs.id }}" iPad

      - name: Run main iPad UI tests
        if: ${{ !cancelled() && steps.ipad_ui_build.outcome == 'success' }}
        timeout-minutes: 60
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh main \
            "${{ steps.simulator.outputs.id }}" iPad

      - name: Upload iPad UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ipad-ui-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  ipad-profile-ui-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    runs-on: macos-26
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - name: Select an iPadOS 26 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 26 iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Prefer an iPadOS 26 hardware keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.simulator.outputs.id }}"

      - name: Build iPad UI tests
        id: ipad_ui_build
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh build \
            "${{ steps.simulator.outputs.id }}" iPad

      - name: Run iPad profile UI tests
        if: ${{ !cancelled() && steps.ipad_ui_build.outcome == 'success' }}
        timeout-minutes: 60
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh profile \
            "${{ steps.simulator.outputs.id }}" iPad

      - name: Upload iPad profile UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ipad-profile-ui-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  # The iOS 18 unit tests share this job with the profile UI phase. The unit
  # step also warms the UI build's derived data.
  minimum-ios-18:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Select an iOS 18 iPhone simulator
        id: iphone_simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 18 iPhone)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Select an iPadOS 18 simulator
        id: ipad_simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 18 iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run unit tests on iOS 18
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          derived_data_path="$(
            .github/ci-tools/run-ipad-ui-tests.sh derived-data-path \
              "${{ steps.ipad_simulator.outputs.id }}"
          )"
          xcodebuild test \
            -scheme Surround \
            -project Surround.xcodeproj \
            -destination "platform=iOS Simulator,id=${{ steps.iphone_simulator.outputs.id }}" \
            -derivedDataPath "$derived_data_path" \
            -only-testing:SurroundTests \
            -resultBundlePath TestResults/SurroundTests-iOS18.xcresult

      - name: Prefer an iPadOS 18 hardware keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.ipad_simulator.outputs.id }}"

      - name: Build iPad UI tests on iPadOS 18
        id: ipad_ui_build
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh build \
            "${{ steps.ipad_simulator.outputs.id }}" iPadOS18

      - name: Run iPad profile UI tests on iPadOS 18
        if: ${{ !cancelled() && steps.ipad_ui_build.outcome == 'success' }}
        timeout-minutes: 60
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh profile \
            "${{ steps.ipad_simulator.outputs.id }}" iPadOS18

      - name: Upload iOS 18 test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ios-18-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  minimum-ios-18-ui-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    runs-on: macos-15
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Select an iPadOS 18 simulator
        id: ipad_simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 18 iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Prefer an iPadOS 18 hardware keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.ipad_simulator.outputs.id }}"

      - name: Build iPad UI tests on iPadOS 18
        id: ipad_ui_build
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh build \
            "${{ steps.ipad_simulator.outputs.id }}" iPadOS18

      - name: Run main iPad UI tests on iPadOS 18
        if: ${{ !cancelled() && steps.ipad_ui_build.outcome == 'success' }}
        timeout-minutes: 60
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh main \
            "${{ steps.ipad_simulator.outputs.id }}" iPadOS18

      - name: Upload iPadOS 18 UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ios-18-ui-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  # Keep keyboard-sensitive journeys off the main/profile runners. Composer
  # and continuity have independent limits so adding fold journeys cannot
  # consume the existing composer's budget. Leave 25 minutes for setup,
  # building, and uploads beyond the 5 + 45 + 45 minute UI step limits.
  ipad-composer-ui-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    name: iPadOS ${{ matrix.ios }} composer and continuity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: '26'
            runner: macos-26
          - ios: '18'
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2 for iPadOS 18
        if: ${{ matrix.ios == '18' }}
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Select an iPadOS ${{ matrix.ios }} simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh '${{ matrix.ios }}' iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Prefer an iPadOS ${{ matrix.ios }} hardware keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.simulator.outputs.id }}"

      - name: Build iPad UI tests
        id: ipad_ui_build
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh build \
            "${{ steps.simulator.outputs.id }}" "iPadOS${{ matrix.ios }}"

      - name: Verify iPadOS ${{ matrix.ios }} composer input
        timeout-minutes: 5
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh preflight \
            "${{ steps.simulator.outputs.id }}" "iPadOS${{ matrix.ios }}"

      - name: Run isolated iPad composer UI tests
        if: ${{ !cancelled() && steps.ipad_ui_build.outcome == 'success' }}
        timeout-minutes: 45
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh composer \
            "${{ steps.simulator.outputs.id }}" "iPadOS${{ matrix.ios }}"

      - name: Run iPad game continuity UI tests
        if: ${{ !cancelled() && steps.ipad_ui_build.outcome == 'success' }}
        timeout-minutes: 45
        shell: bash
        run: |
          .github/ci-tools/run-ipad-ui-tests.sh continuity \
            "${{ steps.simulator.outputs.id }}" "iPadOS${{ matrix.ios }}"

      - name: Upload iPad composer and continuity UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ipad-${{ matrix.ios }}-composer-continuity-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  # Explicitly selected followup coverage; normal events retain the full matrix.
  ipad18-focused-ui-tests:
    name: iPadOS 18 focused UI verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope == 'ipad18-focus' }}
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Select an iPadOS 18 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 18 iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Prefer an iPadOS 18 hardware keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.simulator.outputs.id }}"

      - name: Build focused iPad UI tests
        id: ipad_ui_build
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          .github/ci-tools/run-ipad-ui-tests.sh build \
            "${{ steps.simulator.outputs.id }}" iPadOS18-Focused \
            2>&1 | tee TestResults/iPadOS18-Focused-build.log

      - name: Run six focused iPadOS 18 UI tests
        if: ${{ !cancelled() && steps.ipad_ui_build.outcome == 'success' }}
        timeout-minutes: 35
        shell: bash
        run: |
          test_cases=(
            GameContinuityUITests/testMovePreviewKeepsAnExitAcrossLayouts
            ProfileUITests/testHomeGameMenusOpenOpponentProfilesWithoutOpeningGames
            ProfileUITests/testPickerProfilesSelectDifferentOpponentsWithoutReplacingEditedChallenge
            SurroundUITests/testLiveGameBannerUsesHomeNavigationStack
            SurroundUITests/testRestoredLiveAutomatchLocksQuickMatchForm
            SurroundUITests/testVariationSharingDraftSurvivesChatSelection
          )
          selection_arguments=()
          for test_case in "${test_cases[@]}"; do
            test_class="${test_case%%/*}"
            test_name="${test_case#*/}"
            test_source="SurroundUITests/${test_class}.swift"
            class_count="$(grep -Ec "^[[:space:]]*final[[:space:]]+class[[:space:]]+${test_class}[[:space:]]*:[[:space:]]*SurroundJourneyUITestCase[[:space:]]*\{" "$test_source" || true)"
            declaration_count="$(grep -Ec "^[[:space:]]*func[[:space:]]+${test_name}[[:space:]]*\([[:space:]]*\)" "$test_source" || true)"
            if [[ "$class_count" != "1" || "$declaration_count" != "1" ]]; then
              echo "Expected exactly one ${test_class} class and ${test_name} declaration in ${test_source}. Update the focused iPadOS 18 selection when renaming or moving it." >&2
              exit 1
            fi
            selection_arguments+=("-only-testing:SurroundUITests/${test_case}")
          done
          derived_data_path="$(
            .github/ci-tools/run-ipad-ui-tests.sh derived-data-path \
              "${{ steps.simulator.outputs.id }}"
          )"
          python3 .github/ci-tools/diagnose-ipad-animation-stalls.py \
            --simulator "${{ steps.simulator.outputs.id }}" \
            --output TestResults/iPadOS18-Focused-Diagnostics \
            --native-resize-capture -- \
            xcodebuild test-without-building \
            -scheme Surround \
            -project Surround.xcodeproj \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$derived_data_path" \
            -parallel-testing-enabled NO \
            "${selection_arguments[@]}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath TestResults/SurroundUITests-iPadOS18-Focused.xcresult

      - name: Upload focused iPadOS 18 results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ipad-18-focused-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  catalyst-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_scope != 'ipad18-focus' }}
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build for Mac Catalyst
        shell: bash
        run: |
          xcodebuild build \
            -scheme Surround \
            -project Surround.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO
