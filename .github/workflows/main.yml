name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select an iOS 26 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 26)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -scheme Surround \
            -project Surround.xcodeproj \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:SurroundTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/SurroundTests.xcresult

      - name: Export coverage report
        if: ${{ always() && hashFiles('TestResults/SurroundTests.xcresult/**') != '' }}
        shell: bash
        run: xcrun xccov view --report --json TestResults/SurroundTests.xcresult > TestResults/coverage.json

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  ipad-ui-tests:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select an iPadOS 26 simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 26 iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Configure the iPadOS 26 test keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.simulator.outputs.id }}"

      - name: Run iPad UI tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -scheme Surround \
            -project Surround.xcodeproj \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:SurroundUITests \
            -resultBundlePath TestResults/SurroundUITests-iPad.xcresult

      - name: Upload iPad UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ipad-ui-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  minimum-ios-18:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Select an iOS 18 iPhone simulator
        id: iphone_simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 18 iPhone)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Select an iPadOS 18 simulator
        id: ipad_simulator
        shell: bash
        run: |
          simulator_id="$(.github/ci-tools/select-ios-simulator.sh 18 iPad)"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Configure the iPadOS 18 test keyboard
        shell: bash
        run: |
          .github/ci-tools/configure-ios-simulator-hardware-keyboard.sh \
            "${{ steps.ipad_simulator.outputs.id }}"

      - name: Run unit tests on iOS 18
        shell: bash
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -scheme Surround \
            -project Surround.xcodeproj \
            -destination "platform=iOS Simulator,id=${{ steps.iphone_simulator.outputs.id }}" \
            -only-testing:SurroundTests \
            -resultBundlePath TestResults/SurroundTests-iOS18.xcresult

      - name: Run iPad UI tests on iPadOS 18
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Surround \
            -project Surround.xcodeproj \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.ipad_simulator.outputs.id }}" \
            -only-testing:SurroundUITests \
            -resultBundlePath TestResults/SurroundUITests-iPadOS18.xcresult

      - name: Upload iOS 18 test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surround-ios-18-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

  catalyst-build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build for Mac Catalyst
        shell: bash
        run: |
          xcodebuild build \
            -scheme Surround \
            -project Surround.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO
